name: Validate skill

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: skill-factor-coverage-filter
      - uses: actions/checkout@v4
        with:
          repository: quantskills/registry
          path: contract-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          python -m pip install -r contract-registry/requirements-dev.txt
          python -m pip install -r skill-factor-coverage-filter/requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q skill-factor-coverage-filter/tests
      - name: Check CLI
        run: python skill-factor-coverage-filter/scripts/coverage_filter.py --help
      - name: Run synthetic smoke workflow
        run: |
          python skill-factor-coverage-filter/examples/generate_smoke_data.py --output-dir /tmp/coverage-smoke/data
          python skill-factor-coverage-filter/scripts/coverage_filter.py --manifest /tmp/coverage-smoke/data/manifest.json --output-dir /tmp/coverage-smoke/out --start-date 2023-01-02 --end-date 2023-01-09 --min-date-coverage 1 --min-symbol-coverage 1 --min-finite-ratio 0.9 --min-cross-section 3
      - name: Validate catalog contract
        run: python contract-registry/scripts/validate_skill.py skill-factor-coverage-filter --contract-mode enforce
      - name: Validate output contract
        run: python contract-registry/scripts/validate_contract.py /tmp/coverage-smoke/out/ranked_factor_set.json
      - name: Validate optional qsh-form
        run: node skill-factor-coverage-filter/scripts/validate-qsh-form.mjs skill-factor-coverage-filter/SKILL.md
